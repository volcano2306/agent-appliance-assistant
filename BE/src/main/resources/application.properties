# Public template. Use environment variables for local credentials and paths.
server.port=${SERVER_PORT:18083}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jiadian}
app.db.init=${APP_DB_INIT:false}
app.db.seed=${APP_DB_SEED:false}
app.data.root=${APP_DATA_ROOT:../data}
app.data.camera-dir=${APP_CAMERA_DIR:${app.data.root}/sms10(camera)}
app.upload.local-dir=${APP_UPLOAD_DIR:../uploads}
# Legacy external parser; see docs/SETUP.md before invoking /parse.
app.python.command=${APP_PYTHON_COMMAND:python}
app.python.parser-script=${APP_PYTHON_PARSER_SCRIPT:}
wx.app-id=${WX_APP_ID:}
wx.app-secret=${WX_APP_SECRET:}
oss.endpoint=${OSS_ENDPOINT:http://localhost:9000}
oss.access-key=${OSS_ACCESS_KEY:replace-with-local-access-key}
oss.secret-key=${OSS_SECRET_KEY:replace-with-local-secret-key}
oss.bucket=${OSS_BUCKET:manuals}
oss.public-url=${OSS_PUBLIC_URL:http://localhost:9000/manuals}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.models=${OPENROUTER_MODELS:google/gemma-4-26b-a4b-it:free,google/gemma-3-27b-it:free,google/gemma-3-12b-it:free,google/gemma-3-4b-it:free,google/gemma-3n-e4b-it:free}
ai.default-target=${AI_DEFAULT_TARGET:newapi}
ai.temperature=0.2
ai.timeout-seconds=60
ai.manual-rag-top-k=5
ai.max-retrieved-fragments=5
ai.min-fragment-score=16
ai.fragment.chunk-size=700
ai.fragment.chunk-overlap=120
ai.embedding.min-similarity=0.45
ai.embedding.keyword-weight=0.4
ai.embedding.bm25-weight=0.3
ai.embedding.vector-weight=0.6
ai.history.max-messages=6
ai.targets.openrouter.base-url=${openrouter.base-url}
ai.targets.openrouter.api-key=${openrouter.api-key}
ai.targets.openrouter.chat-path=/chat/completions
ai.targets.openrouter.model=${OPENROUTER_MODEL:google/gemma-4-26b-a4b-it:free}
ai.targets.openrouter.tool-model=${OPENROUTER_MODEL:google/gemma-4-26b-a4b-it:free}
ai.targets.newapi.base-url=${NEWAPI_BASE_URL:https://windhub.cc/v1}
ai.targets.newapi.api-key=${NEWAPI_API_KEY:}
ai.targets.newapi.chat-path=/chat/completions
ai.targets.newapi.model=${NEWAPI_MODEL:qwen3.8-flash-next}
ai.targets.newapi.tool-model=${NEWAPI_MODEL:qwen3.8-flash-next}
searxng.base-url=${SEARXNG_BASE_URL:}
searxng.search-path=/search
searxng.language=zh-CN
searxng.general-categories=general
searxng.latest-categories=general,news
searxng.latest-time-range=month
searxng.timeout-seconds=10
searxng.max-candidates=12
searxng.max-results=5
agent.python.enabled=${AGENT_PYTHON_ENABLED:true}
agent.python.base-url=${AGENT_PYTHON_BASE_URL:http://localhost:8001}
agent.python.internal-token=${AGENT_INTERNAL_TOKEN:}
agent.python.timeout-seconds=${AGENT_PYTHON_TIMEOUT_SECONDS:100}
agent.python.fallback-to-java=${AGENT_PYTHON_FALLBACK_TO_JAVA:true}
ai.memory.enabled=${AI_MEMORY_ENABLED:false}
ai.memory.execution-enabled=${AI_MEMORY_EXECUTION_ENABLED:false}
ai.memory.compression-strategy=${AI_MEMORY_COMPRESSION_STRATEGY:threshold}
ai.memory.trigger-tokens=${AI_MEMORY_TRIGGER_TOKENS:1500}
ai.memory.min-growth-tokens=${AI_MEMORY_MIN_GROWTH_TOKENS:500}
ai.memory.recent-turns=${AI_MEMORY_RECENT_TURNS:5}
ai.memory.summary-max-tokens=${AI_MEMORY_SUMMARY_MAX_TOKENS:600}
# Empty binds to the nullable Integer while memory is disabled.
# Set only after confirming the provider limit.
ai.memory.model-context-window=${AI_MEMORY_MODEL_CONTEXT_WINDOW:}
